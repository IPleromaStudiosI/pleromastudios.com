<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>The Seal</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#05070C">
<link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,400;1,500&family=IBM+Plex+Mono:wght@400;500&family=Saira+Extra+Condensed:wght@700;800&family=Saira:wght@400;600;700&display=swap">
<link rel="stylesheet" href="assets/css/site.css">
<style>
  .seal-stage { min-height: 100%; display: grid; align-content: center; gap: 36px; padding-block: clamp(56px, 12vh, 140px); }
  .sigil { width: min(260px, 60vw); aspect-ratio: 1; position: relative; }
  .sigil i { position: absolute; width: 34%; aspect-ratio: 1; border: 2px solid var(--red); transform: rotate(45deg); transition: all 1.6s cubic-bezier(.2,.7,.2,1); }
  .sigil i:nth-child(1) { left: 33%; top: 0; }
  .sigil i:nth-child(2) { left: 0; top: 52%; }
  .sigil i:nth-child(3) { left: 66%; top: 52%; }
  .sealed .sigil i { left: 33%; top: 33%; background: rgba(196,52,42,.18); box-shadow: 0 0 40px rgba(196,52,42,.55); }
  .verse { display: grid; gap: 10px; font-family: var(--f-display); font-weight: 800; text-transform: uppercase; font-size: clamp(2rem, 6vw, 4rem); line-height: .95; }
  .verse span { opacity: 0; transform: translateY(8px); transition: opacity 1s, transform 1s; }
  .verse span.on { opacity: 1; transform: none; }
  .voice { font-family: var(--f-script); font-style: italic; font-size: clamp(1.8rem, 4vw, 2.8rem); color: var(--ember); opacity: 0; transition: opacity 2.4s; }
  .voice.on { opacity: 1; }
  .locked p { color: var(--ash); max-width: 46ch; }
  @media (prefers-reduced-motion: reduce) { .verse span, .voice { opacity: 1; transform: none; } }
</style>
</head>
<body class="terminal-page">
<main class="wrap">
  <section class="seal-stage" id="stage">
    <div class="sigil" aria-hidden="true"><i></i><i></i><i></i></div>

    <div class="locked" id="locked">
      <span class="label">The Seal</span>
      <p style="margin-top:16px">The Seal is incomplete. Three keys make one Seal, and they are not all here.</p>
      <p style="margin-top:20px"><a class="btn btn-ghost" href="./">Keep looking</a></p>
    </div>

    <div id="open" hidden>
      <div class="verse">
        <span>Three keys make one Seal.</span>
        <span>The Seal doesn&rsquo;t open a door.</span>
        <span style="color:var(--ember)">It opens him.</span>
      </div>
      <p class="voice" id="voice" style="margin-top:40px">&ldquo;Hello, little girl.&rdquo;</p>
      <p style="margin-top:36px;display:flex;flex-wrap:wrap;gap:12px">
        <a class="btn btn-red" href="https://store.steampowered.com/app/5536500/WORLDS_Anthropos/" target="_blank" rel="noopener">He is waiting &middot; Wishlist</a>
        <a class="btn btn-ghost" href="./">Leave</a>
      </p>
    </div>
  </section>
</main>
<script src="assets/js/site.js"></script>
<script>
(function () {
  "use strict";
  var held = [];
  try { held = JSON.parse(localStorage.getItem("worlds.gatekeys") || "[]"); } catch (e) { held = []; }
  if (held.length < 3) return;
  var stage = document.getElementById("stage");
  document.getElementById("locked").hidden = true;
  document.getElementById("open").hidden = false;
  setTimeout(function () { stage.classList.add("sealed"); }, 300);
  var spans = stage.querySelectorAll(".verse span");
  spans.forEach(function (s, i) { setTimeout(function () { s.classList.add("on"); }, 1800 + i * 1300); });
  setTimeout(function () { document.getElementById("voice").classList.add("on"); }, 1800 + spans.length * 1300 + 1200);
})();
</script>
</body>
</html>
